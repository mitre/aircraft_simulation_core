name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cppcheck ninja-build

      - name: Run cppcheck
        run: make cpp

      - name: Render single-page cppcheck report
        if: always() && hashFiles('cppcheck.xml') != ''
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_REVISION: ${{ github.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen python .scripts/render_cppcheck_report.py \
            --repository "$REPORT_REPOSITORY" \
            --revision "$REPORT_REVISION" \
            --run-url "$REPORT_RUN_URL"

      - name: Upload directly viewable cppcheck report
        id: cppcheck_report
        if: always() && hashFiles('cppcheck-report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: cppcheck-report.html
          archive: false
          if-no-files-found: error

      - name: Add cppcheck report link
        if: always() && steps.cppcheck_report.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.cppcheck_report.outputs.artifact-url }}
        run: echo "### [Open the cppcheck report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show tool versions
        run: |
          cmake --version
          c++ --version

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: |
          cmake --build build --target simcore_public_tests --parallel

      - name: Test
        run: |
          ctest --test-dir build --output-on-failure --parallel 2
