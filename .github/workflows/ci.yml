name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release policy
        run: python3 -m unittest discover -s .scripts/tests -v
      - name: Check CMake version
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = merge_group ]; then
            python3 .scripts/release_policy.py --base "$BASE_SHA"
          else
            python3 .scripts/release_policy.py
          fi

  cppcheck:
    name: Cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cppcheck ninja-build

      - name: Run cppcheck
        run: make cpp

      - name: Render single-page cppcheck report
        if: always() && hashFiles('cppcheck.xml') != ''
        env:
          REPORT_REPOSITORY: ${{ github.repository }}
          REPORT_REVISION: ${{ github.sha }}
          REPORT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run --frozen python .scripts/render_cppcheck_report.py \
            --repository "$REPORT_REPOSITORY" \
            --revision "$REPORT_REVISION" \
            --run-url "$REPORT_RUN_URL"

      - name: Upload directly viewable cppcheck report
        id: cppcheck_report
        if: always() && hashFiles('cppcheck-report.html') != ''
        uses: actions/upload-artifact@v7
        with:
          path: cppcheck-report.html
          archive: false
          if-no-files-found: error

      - name: Add cppcheck report link
        if: always() && steps.cppcheck_report.outcome == 'success'
        env:
          REPORT_URL: ${{ steps.cppcheck_report.outputs.artifact-url }}
        run: echo "### [Open the cppcheck report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"

  build-and-test:
    uses: ./.github/workflows/build.yml

  required:
    name: CI required
    runs-on: ubuntu-24.04
    if: always()
    needs: [version, cppcheck, build-and-test]
    steps:
      - name: Require every validation job to pass
        env:
          VERSION_RESULT: ${{ needs.version.result }}
          CPPCHECK_RESULT: ${{ needs.cppcheck.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
        run: |
          test "$VERSION_RESULT" = success
          test "$CPPCHECK_RESULT" = success
          test "$BUILD_RESULT" = success
